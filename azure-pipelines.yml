# =============================================================================
# Terminator Sec — Azure Pipelines
# =============================================================================
# Branch Strategy:
#   Feature  : users/abhinav/<feature_name>     → CI only (build + test)
#   Release  : release/abhinav/<feature_name>   → CI + Deploy to trsec_sit
#   Protected: main, trsec_sit                  → No direct push; PR only
#
# SIT Environment:
#   Name     : trsec-sit
#   Resource : Windows VM (self-hosted Azure Pipelines agent)
#   Approval : Manual gate required before deployment
# =============================================================================

trigger:
  branches:
    include:
      - users/abhinav/*
      - release/abhinav/*
  paths:
    exclude:
      - "*.md"
      - ".gitignore"
      - "azure-devops-terminator-sec-tasks.csv"

pr:
  branches:
    include:
      - trsec_sit
      - main
  paths:
    exclude:
      - "*.md"

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variables:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "20.x"
  DASHBOARD_DIR: "apps/dashboard"
  BIN_DIR: "$(Build.ArtifactStagingDirectory)/bin"
  IS_RELEASE_BRANCH: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/release/abhinav/')]
  FEATURE_NAME: $[replace(variables['Build.SourceBranchName'], 'abhinav/', '')]

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:

  # ===========================================================================
  # STAGE 1 — CI: Build & Test (runs on ALL branches)
  # ===========================================================================
  - stage: CI
    displayName: "CI — Build & Test"
    jobs:

      # -----------------------------------------------------------------------
      # JOB 1: Go Backend — Build & Test
      # -----------------------------------------------------------------------
      - job: Go_Build_Test
        displayName: "Go Backend — Build & Test"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            fetchDepth: 0

          - task: GoTool@0
            displayName: "Install Go $(GO_VERSION)"
            inputs:
              version: "$(GO_VERSION)"

          - script: |
              echo "==> Go version"
              go version
              echo "==> Module: $(go list -m)"
            displayName: "Go Environment Info"

          - task: Cache@2
            displayName: "Cache Go module dependencies"
            inputs:
              key: 'go-mod | "$(Agent.OS)" | go.sum'
              restoreKeys: |
                go-mod | "$(Agent.OS)"
              path: "$(GOPATH)/pkg/mod"

          - script: |
              go mod download
            displayName: "Download Go Modules"

          - script: |
              echo "==> Running Go vet..."
              go vet ./...
            displayName: "Go Vet — Static Analysis"

          - script: |
              echo "==> Running tests with race detector..."
              go test -v -race -count=1 -timeout 120s ./pkg/...
            displayName: "Go Test — Unit Tests + Race Detector"

          - script: |
              echo "==> Running benchmarks..."
              go test -bench=. -benchtime=3s -run='^$' ./pkg/engine/...
            displayName: "Go Benchmark — Threat Engine Latency"

          - script: |
              echo "==> Building macOS (darwin/amd64) binaries..."
              mkdir -p $(BIN_DIR)/darwin
              GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin/terminator-agent   ./cmd/terminator-agent
              GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin/terminator-cli     ./cmd/terminator-cli
              GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin/terminator-server  ./cmd/terminator-server
              echo "==> Building macOS (darwin/arm64) binaries..."
              mkdir -p $(BIN_DIR)/darwin-arm64
              GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin-arm64/terminator-agent   ./cmd/terminator-agent
              GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin-arm64/terminator-cli     ./cmd/terminator-cli
              GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o $(BIN_DIR)/darwin-arm64/terminator-server  ./cmd/terminator-server
              echo "==> Building Windows (amd64) binaries..."
              mkdir -p $(BIN_DIR)/windows
              GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/windows/terminator-agent.exe   ./cmd/terminator-agent
              GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/windows/terminator-cli.exe     ./cmd/terminator-cli
              GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/windows/terminator-server.exe  ./cmd/terminator-server
              echo "==> Building Linux (amd64) binaries..."
              mkdir -p $(BIN_DIR)/linux
              GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/linux/terminator-agent   ./cmd/terminator-agent
              GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/linux/terminator-cli     ./cmd/terminator-cli
              GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o $(BIN_DIR)/linux/terminator-server  ./cmd/terminator-server
            displayName: "Go Build — All Platforms"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Go Binaries"
            inputs:
              targetPath: "$(BIN_DIR)"
              artifact: "go-binaries-$(Build.BuildId)"
              publishLocation: "pipeline"

      # -----------------------------------------------------------------------
      # JOB 2: React Dashboard — Build
      # -----------------------------------------------------------------------
      - job: Dashboard_Build
        displayName: "Dashboard — Node Build"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Install Node.js $(NODE_VERSION)"
            inputs:
              versionSpec: "$(NODE_VERSION)"

          - task: Cache@2
            displayName: "Cache node_modules"
            inputs:
              key: 'npm | "$(Agent.OS)" | $(DASHBOARD_DIR)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: "$(DASHBOARD_DIR)/node_modules"

          - script: |
              cd $(DASHBOARD_DIR)
              npm ci
            displayName: "npm ci — Install Dependencies"

          - script: |
              cd $(DASHBOARD_DIR)
              npm run build
            displayName: "Vite Build — Production Dashboard"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Dashboard Dist"
            inputs:
              targetPath: "$(DASHBOARD_DIR)/dist"
              artifact: "dashboard-dist-$(Build.BuildId)"
              publishLocation: "pipeline"

  # ===========================================================================
  # STAGE 2 — Deploy to SIT VM  (release/abhinav/* branches ONLY)
  # Targets the 'trsec-sit' Azure DevOps Environment (Windows VM resource)
  # Manual approval gate configured on the environment in ADO.
  # ===========================================================================
  - stage: Deploy_SIT
    displayName: "CD — Deploy to trsec-sit (Windows VM)"
    dependsOn: CI
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/abhinav/')
      )
    jobs:

      # deployment job — runs ON the registered Windows VM agent
      - deployment: Deploy_To_SIT_VM
        displayName: "Deploy Binaries to trsec-sit VM"
        environment:
          name: trsec-sit          # must match the Environment name in ADO
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                # ── 1. Download Windows build artifact from CI stage ──────────
                - task: DownloadPipelineArtifact@2
                  displayName: "Download Windows Binaries"
                  inputs:
                    artifact: "go-binaries-$(Build.BuildId)"
                    path: "$(Pipeline.Workspace)\\bin"

                - task: DownloadPipelineArtifact@2
                  displayName: "Download Dashboard Dist"
                  inputs:
                    artifact: "dashboard-dist-$(Build.BuildId)"
                    path: "$(Pipeline.Workspace)\\dashboard-dist"

                # ── 2. Stop any existing running Terminator services ──────────
                - task: PowerShell@2
                  displayName: "Stop Existing Terminator Processes"
                  inputs:
                    targetType: inline
                    script: |
                      Write-Host "==> Stopping any running Terminator Sec processes..."
                      Stop-Process -Name terminator-agent  -Force -ErrorAction SilentlyContinue
                      Stop-Process -Name terminator-server -Force -ErrorAction SilentlyContinue
                      Write-Host "==> Processes stopped (or were not running)."

                # ── 3. Copy binaries to SIT deploy directory ──────────────────
                - task: PowerShell@2
                  displayName: "Deploy Binaries to C:\\TerminatorSIT"
                  inputs:
                    targetType: inline
                    script: |
                      $deployDir = "C:\TerminatorSIT"
                      $binSrc   = "$(Pipeline.Workspace)\bin\windows"
                      $dashSrc  = "$(Pipeline.Workspace)\dashboard-dist"

                      Write-Host "==> Creating deploy directory: $deployDir"
                      New-Item -ItemType Directory -Force -Path $deployDir | Out-Null
                      New-Item -ItemType Directory -Force -Path "$deployDir\dashboard" | Out-Null

                      Write-Host "==> Copying Windows binaries..."
                      Copy-Item "$binSrc\terminator-agent.exe"  -Destination "$deployDir\" -Force
                      Copy-Item "$binSrc\terminator-cli.exe"    -Destination "$deployDir\" -Force
                      Copy-Item "$binSrc\terminator-server.exe" -Destination "$deployDir\" -Force

                      Write-Host "==> Copying Dashboard dist..."
                      Copy-Item "$dashSrc\*" -Destination "$deployDir\dashboard\" -Recurse -Force

                      Write-Host "==> Build: $(Build.BuildId) | Branch: $(Build.SourceBranchName)"
                      Set-Content "$deployDir\BUILD_INFO.txt" "Build: $(Build.BuildId)`nBranch: $(Build.SourceBranchName)`nCommit: $(Build.SourceVersion)`nDeployed: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

                      Write-Host "==> Deploy complete. Contents:"
                      Get-ChildItem $deployDir

                # ── 4. Start terminator-server on SIT ─────────────────────────
                - task: PowerShell@2
                  displayName: "Start terminator-server on SIT (port 8080)"
                  inputs:
                    targetType: inline
                    script: |
                      $deployDir = "C:\TerminatorSIT"
                      Write-Host "==> Starting terminator-server..."
                      Start-Process `
                        -FilePath "$deployDir\terminator-server.exe" `
                        -ArgumentList "-port 8080" `
                        -WindowStyle Hidden `
                        -PassThru
                      Start-Sleep -Seconds 3
                      Write-Host "==> Server started. Verifying port 8080..."
                      $conn = Test-NetConnection -ComputerName localhost -Port 8080
                      if (-not $conn.TcpTestSucceeded) {
                        Write-Error "terminator-server did not bind to port 8080!"
                        exit 1
                      }
                      Write-Host "==> terminator-server is UP on port 8080."

            # ── on: routeTrafficStrategy (runs after deploy) ─────────────────
            on:
              failure:
                steps:
                  - task: PowerShell@2
                    displayName: "Rollback — Stop Failed Deployment"
                    inputs:
                      targetType: inline
                      script: |
                        Write-Host "==> Deployment failed. Stopping processes..."
                        Stop-Process -Name terminator-server -Force -ErrorAction SilentlyContinue
                        Stop-Process -Name terminator-agent  -Force -ErrorAction SilentlyContinue
                        Write-Host "==> Rollback complete."

  # ===========================================================================
  # STAGE 3 — SIT Smoke Tests  (runs on SIT VM after deployment)
  # ===========================================================================
  - stage: SIT_Smoke_Tests
    displayName: "SIT — Smoke Tests & Validation"
    dependsOn: Deploy_SIT
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/abhinav/')
      )
    jobs:

      - deployment: SIT_Tests
        displayName: "Run Smoke Tests on trsec-sit VM"
        environment:
          name: trsec-sit
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                # ── Test 1: API Health Check ──────────────────────────────────
                - task: PowerShell@2
                  displayName: "Smoke Test 1 — /api/status health check"
                  inputs:
                    targetType: inline
                    script: |
                      Write-Host "==> Checking /api/status..."
                      $resp = Invoke-RestMethod -Uri "http://localhost:8080/api/status" -Method GET
                      Write-Host "Agent Version : $($resp.agent_version)"
                      Write-Host "Platform      : $($resp.platform)"
                      Write-Host "DNS Proxy     : $($resp.dns_proxy_active)"
                      if (-not $resp.agent_version) {
                        Write-Error "Health check failed: no agent_version returned"
                        exit 1
                      }
                      Write-Host "==> PASS: /api/status healthy."

                # ── Test 2: CLI Domain Analysis (allowlist) ───────────────────
                - task: PowerShell@2
                  displayName: "Smoke Test 2 — CLI: google.com should ALLOW"
                  inputs:
                    targetType: inline
                    script: |
                      $cli = "C:\TerminatorSIT\terminator-cli.exe"
                      Write-Host "==> Testing whitelisted domain: google.com"
                      $out = & $cli test-domain google.com 2>&1
                      Write-Host $out
                      if ($out -notmatch "ALLOW") {
                        Write-Error "FAIL: google.com should be ALLOW"
                        exit 1
                      }
                      Write-Host "==> PASS: google.com → ALLOW"

                # ── Test 3: CLI Domain Analysis (C2 block) ────────────────────
                - task: PowerShell@2
                  displayName: "Smoke Test 3 — CLI: emotet-c2.net should AUTO_BLOCK"
                  inputs:
                    targetType: inline
                    script: |
                      $cli = "C:\TerminatorSIT\terminator-cli.exe"
                      Write-Host "==> Testing known C2 domain: emotet-c2.net"
                      $out = & $cli test-domain emotet-c2.net 2>&1
                      Write-Host $out
                      if ($out -notmatch "AUTO_BLOCK") {
                        Write-Error "FAIL: emotet-c2.net should be AUTO_BLOCK"
                        exit 1
                      }
                      Write-Host "==> PASS: emotet-c2.net → AUTO_BLOCK"

                # ── Test 4: Threat Simulator API ──────────────────────────────
                - task: PowerShell@2
                  displayName: "Smoke Test 4 — Threat Simulator API"
                  inputs:
                    targetType: inline
                    script: |
                      Write-Host "==> Simulating DGA threat via API..."
                      $body = '{"target":"xk9qz7w4lm2p0a.xyz","threat_type":"dga"}'
                      $resp = Invoke-RestMethod `
                        -Uri "http://localhost:8080/api/threats/simulate" `
                        -Method POST `
                        -ContentType "application/json" `
                        -Body $body
                      Write-Host "Verdict   : $($resp.verdict.action)"
                      Write-Host "Severity  : $($resp.verdict.severity)"
                      Write-Host "Latency   : $($resp.latency_ms) ms"
                      if ($resp.verdict.severity -lt 4) {
                        Write-Error "FAIL: DGA domain severity too low ($($resp.verdict.severity))"
                        exit 1
                      }
                      if ($resp.latency_ms -gt 10) {
                        Write-Error "FAIL: Latency exceeded 10ms budget ($($resp.latency_ms) ms)"
                        exit 1
                      }
                      Write-Host "==> PASS: Threat simulator responded correctly within latency budget."

                # ── Test 5: Fleet API ─────────────────────────────────────────
                - task: PowerShell@2
                  displayName: "Smoke Test 5 — /api/fleet returns device list"
                  inputs:
                    targetType: inline
                    script: |
                      Write-Host "==> Checking /api/fleet..."
                      $fleet = Invoke-RestMethod -Uri "http://localhost:8080/api/fleet" -Method GET
                      Write-Host "Fleet devices: $($fleet.Count)"
                      if ($fleet.Count -lt 1) {
                        Write-Error "FAIL: Fleet returned no devices"
                        exit 1
                      }
                      Write-Host "==> PASS: Fleet returned $($fleet.Count) device(s)."

                # ── Publish Test Summary ──────────────────────────────────────
                - task: PowerShell@2
                  displayName: "Publish SIT Test Summary"
                  condition: always()
                  inputs:
                    targetType: inline
                    script: |
                      Write-Host "##[section]SIT Smoke Test Summary — Build $(Build.BuildId)"
                      Write-Host "Branch  : $(Build.SourceBranchName)"
                      Write-Host "Commit  : $(Build.SourceVersion)"
                      Write-Host "Tests   : /api/status | CLI ALLOW | CLI AUTO_BLOCK | Simulator | Fleet"

  # ===========================================================================
  # STAGE 4 — Auto PR: release/abhinav/* → trsec_sit (after SIT passes)
  # ===========================================================================
  - stage: Merge_To_SIT_Branch
    displayName: "CD — Create PR to trsec_sit branch"
    dependsOn: SIT_Smoke_Tests
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/abhinav/')
      )
    jobs:

      - job: Create_PR_To_SIT
        displayName: "Auto PR — release branch → trsec_sit"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - script: |
              BRANCH="$(Build.SourceBranchName)"
              echo "Release branch: $BRANCH"
              echo "##vso[task.setvariable variable=RELEASE_BRANCH]$BRANCH"
            displayName: "Extract Release Branch Name"

          - task: Bash@3
            displayName: "Create PR via Azure DevOps REST API"
            env:
              AZURE_DEVOPS_TOKEN: $(AZURE_DEVOPS_PAT)
            inputs:
              targetType: "inline"
              script: |
                set -e
                ORG="$(AZURE_DEVOPS_ORG)"
                PROJECT="$(AZURE_DEVOPS_PROJECT)"
                REPO="$(Build.Repository.Name)"
                SOURCE_BRANCH="refs/heads/$(RELEASE_BRANCH)"
                TARGET_BRANCH="refs/heads/trsec_sit"
                BUILD_ID="$(Build.BuildId)"
                COMMIT="$(Build.SourceVersion)"
                SHORT_COMMIT="${COMMIT:0:7}"

                TITLE="[SIT Verified] $(RELEASE_BRANCH) → trsec_sit [Build #${BUILD_ID}]"
                BODY=$(printf '## SIT-Verified Release PR\n\n| Field | Value |\n|---|---|\n| Source | `'"$(RELEASE_BRANCH)"'` |\n| Target | `trsec_sit` |\n| Build | #'"${BUILD_ID}"' |\n| Commit | `'"${SHORT_COMMIT}"'` |\n\n### SIT Smoke Tests Passed\n- [x] /api/status health check\n- [x] CLI ALLOW (google.com)\n- [x] CLI AUTO_BLOCK (emotet-c2.net)\n- [x] Threat Simulator latency < 10ms\n- [x] Fleet API response\n\n### Merge Checklist\n- [ ] Reviewer sign-off\n- [ ] QA approval')

                PAYLOAD=$(jq -n \
                  --arg title "$TITLE" \
                  --arg src   "$SOURCE_BRANCH" \
                  --arg tgt   "$TARGET_BRANCH" \
                  --arg desc  "$BODY" \
                  '{title:$title,sourceRefName:$src,targetRefName:$tgt,description:$desc,isDraft:false}')

                curl -sf -X POST \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Basic $(printf ':%s' "${AZURE_DEVOPS_TOKEN}" | base64 -w0)" \
                  -d "$PAYLOAD" \
                  "https://dev.azure.com/${ORG}/${PROJECT}/_apis/git/repositories/${REPO}/pullrequests?api-version=7.1" \
                || echo "PR may already exist — skipping."

  # ===========================================================================
  # STAGE 5 — Package & Release Artifacts
  # ===========================================================================
  - stage: Package
    displayName: "Package — Distribution Archives"
    dependsOn: Merge_To_SIT_Branch
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/abhinav/')
      )
    jobs:

      - job: Package_Artifacts
        displayName: "Zip & Publish Release Packages"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Go Binaries"
            inputs:
              artifact: "go-binaries-$(Build.BuildId)"
              path: "$(Pipeline.Workspace)/bin"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Dashboard Dist"
            inputs:
              artifact: "dashboard-dist-$(Build.BuildId)"
              path: "$(Pipeline.Workspace)/dashboard-dist"

          - script: |
              set -e
              STAGING="$(Build.ArtifactStagingDirectory)/packages"
              mkdir -p "$STAGING"

              cp -r $(Pipeline.Workspace)/bin/darwin-arm64 /tmp/trsec-macos
              cp -r $(Pipeline.Workspace)/dashboard-dist   /tmp/trsec-macos/dashboard
              cd /tmp && zip -r "$STAGING/terminator-sec-macos-arm64-$(Build.BuildId).zip" trsec-macos/

              cp -r $(Pipeline.Workspace)/bin/windows /tmp/trsec-windows
              cp -r $(Pipeline.Workspace)/dashboard-dist /tmp/trsec-windows/dashboard
              cd /tmp && zip -r "$STAGING/terminator-sec-windows-amd64-$(Build.BuildId).zip" trsec-windows/

              cp -r $(Pipeline.Workspace)/bin/linux /tmp/trsec-linux
              cp -r $(Pipeline.Workspace)/dashboard-dist /tmp/trsec-linux/dashboard
              cd /tmp && zip -r "$STAGING/terminator-sec-linux-amd64-$(Build.BuildId).zip" trsec-linux/

              echo "==> Packages:"
              ls -lh "$STAGING/"
            displayName: "Create Distribution Packages"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Release Packages"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/packages"
              artifact: "release-packages-$(Build.BuildId)"
              publishLocation: "pipeline"
